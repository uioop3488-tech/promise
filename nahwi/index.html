<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나휘님 입사 1주년 캘린더</title>
<meta property="og:title" content="나휘님 입사 1주년 캘린더 🎄">
<meta property="og:description" content="문을 하나씩 열어 우리의 1년을 만나보세요.">
<meta property="og:image" content="assets/team.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Special+Elite&family=Yellowtail&family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/*
VOICE: 따뜻하고 장난스러운 연말 선물 — 동료가 손으로 오려 만든 크리스마스 카드
IDEA: 종이를 오려 붙인 빨간 집 모양 어드벤트 캘린더, 티켓 모양 문 9개
PICTURE: 회색 바탕 위 톱니 가장자리 빨간 집, 흰 선 일러스트 문들, 내리는 눈
COLOUR & TYPE: 크리스마스 레드 + 흰 선 + 회색 바탕 / Yellowtail 로고, Alfa Slab 외곽선 숫자, Special Elite 라벨, 나눔펜 캡션
LAYOUT: 한 화면에 집 하나. 문 열기 → 사진 보임 → 누르면 크게 보기
*/
:root{color-scheme:light dark;
  --bg:light-dark(#c6c5c8,#1f1e22);--ink:light-dark(#1b1b1d,#f1efe9);
  --red:#b5121b;--red2:#c3171f;--red3:#8c0c13;--cream:#fbf6ec;
  --W:min(94vw,500px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 'Gowun Batang',serif;overflow-x:clip;
  display:flex;flex-direction:column;align-items:center;padding:14px 0 28px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

.wrap{position:relative;width:var(--W)}
.logo{position:absolute;left:0;top:-2px;z-index:3;font-family:'Yellowtail',cursive;color:var(--ink);line-height:.82;
  transform:rotate(-8deg);font-size:clamp(40px,11.5vw,58px)}
.logo span{display:block;font-family:'Alfa Slab One';font-size:.5em;letter-spacing:.02em;margin-left:.6em}
.ttl{position:absolute;right:0;top:4px;z-index:3;text-align:right;font-family:'Gowun Batang';font-weight:700;
  font-size:clamp(14px,3.9vw,19px);line-height:1.2}
.ttl small{display:block;font-family:'Special Elite';font-weight:400;font-size:.78em;opacity:.75}

.house-sh{filter:drop-shadow(0 10px 18px rgba(0,0,0,.28))}
.house{position:relative;width:100%;aspect-ratio:1/1.36;background:
  radial-gradient(ellipse at 50% 30%,#c41a22,transparent 70%),var(--red)}
.grid{position:absolute;left:4.5%;right:4.5%;top:22.5%;bottom:3.2%;display:grid;gap:2.2%;
  grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));
  grid-template-areas:"a a a a b b" "a a a a b b" "c c d d b b" "c c d d e e" "c c d d e e" "f f g g e e" "f f g g h h" "i i i i h h"}

/* 칸 + 문 */
.cell{position:relative;perspective:900px;border-radius:3px;z-index:2}
.cell.open{z-index:1}
.win{position:absolute;inset:0;border-radius:3px;overflow:hidden;background:var(--red3) center/cover no-repeat;
  box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.35),inset 0 6px 14px rgba(0,0,0,.45);cursor:zoom-in}
.win::after{content:"크게 보기";position:absolute;right:5px;bottom:5px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;
  padding:2px 7px;border-radius:99px;opacity:0;transition:opacity .3s .6s}
.cell.open .win::after{opacity:1}
.door{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;cursor:pointer;
  transition:transform .9s cubic-bezier(.5,.05,.25,1);border:0;background:none;padding:0;text-align:left}
.cell.open .door{transform:rotateY(-112deg);pointer-events:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px}
.front{background:linear-gradient(160deg,var(--red2),#b0131b);color:#fff;padding:7% 8%;display:flex;flex-direction:column;
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 0 0 1px rgba(0,0,0,.28);
  -webkit-mask:radial-gradient(circle 7px at 100% 50%,transparent 97%,#000);mask:radial-gradient(circle 7px at 100% 50%,transparent 97%,#000)}
.front::before{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.2);border-radius:2px;pointer-events:none}
.back{transform:rotateY(180deg);background:linear-gradient(90deg,#7d0a10,#9a0f16);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.lab{font-family:'Special Elite';font-size:clamp(9px,2.3vw,12px);letter-spacing:.06em;opacity:.92}
.ko{font-family:'Nanum Pen Script';font-size:clamp(14px,3.9vw,19px);line-height:1;opacity:.95;margin-top:auto}
.art{flex:1;position:relative;min-height:0;margin:5% 0}
.art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.art .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.num{font-family:'Alfa Slab One';color:transparent;-webkit-text-stroke:1.6px #fff;line-height:.9;font-size:clamp(30px,9.5vw,52px);letter-spacing:.01em}
.num sup{font-size:.26em;-webkit-text-stroke:0;color:#fff;font-family:'Special Elite';vertical-align:top;margin-left:3px}
.door:focus-visible .front{outline:3px solid #fff;outline-offset:-6px}
.door:hover .front{filter:brightness(1.07)}
.cell:not(.open) .door:hover{transform:rotateY(-9deg)}

.foot{margin-top:16px;display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:14px}
.prog{display:flex;gap:4px}
.prog i{width:9px;height:9px;border-radius:50%;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.prog i.on{background:var(--red)}
.reset{border:0;background:none;text-decoration:underline;font-size:13px;opacity:.6;cursor:pointer;padding:12px 4px}

/* 모달 */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(60,4,8,.62);
  backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
.modal.on{opacity:1;pointer-events:auto}
.card{position:relative;width:min(100%,480px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--cream);color:#2b2222;
  border-radius:10px;padding:26px 18px 20px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.4);
  transform:translateY(24px) scale(.97);transition:transform .45s cubic-bezier(.2,.8,.2,1);
  background-image:radial-gradient(circle at 12px 12px,rgba(181,18,27,.07) 2px,transparent 2.5px);background-size:24px 24px}
.modal.on .card{transform:none}
.x{position:absolute;top:6px;right:6px;width:44px;height:44px;border:0;background:none;font-size:26px;cursor:pointer;color:#7a1218}
.card .lab{color:var(--red);font-size:12px;letter-spacing:.14em}
.card h2{font-size:clamp(22px,6vw,28px);line-height:1.15;margin:4px 0 2px;color:#7a1218;text-wrap:balance}
.card .sub{font-family:'Nanum Pen Script';font-size:22px;color:#6c5d55;line-height:1.1}
.shots{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 10px;margin:16px 0 6px}
.pol{background:#fff;padding:7px 7px 30px;box-shadow:0 6px 14px rgba(0,0,0,.18);position:relative}
.pol:nth-child(odd){transform:rotate(-2deg)}.pol:nth-child(even){transform:rotate(2.5deg)}
.pol img,.pol video{display:block;object-fit:cover;background:#ddd}
.pol figcaption{position:absolute;left:0;right:0;bottom:3px;font-family:'Nanum Pen Script';font-size:19px;color:#444}
.n1 .pol img{width:min(76vw,330px);max-height:52dvh}
.n2 .pol img,.n2 .pol video{width:min(39vw,190px);aspect-ratio:3/4}
.n2 .pol video{width:min(32vw,150px);aspect-ratio:9/16}
.n3 .pol img{width:min(26vw,128px);aspect-ratio:3/4}
.vid{position:relative}
.snd{position:absolute;top:12px;right:12px;border:0;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:5px 10px;cursor:pointer}
.note{font-family:'Nanum Pen Script';font-size:23px;line-height:1.25;color:#4a3e36;margin-top:8px}
.note b{font-weight:400;background:linear-gradient(transparent 60%,rgba(181,18,27,.22) 0)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.door,.card,.modal{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">Nahwi<span>1st YEAR</span></div>
  <div class="ttl">나휘님 입사 1주년<br>어드벤트 캘린더<small>open one by one</small></div>
  <div class="house-sh"><div class="house" id="house"><div class="grid" id="grid"></div></div></div>
</div>
<div class="foot"><span id="cnt">문을 눌러 열어보세요</span><span class="prog" id="prog"></span><button class="reset" id="reset" type="button">다시 닫기</button></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="card" id="card"></div>
</div>
<canvas id="fx"></canvas><canvas id="cf"></canvas>

<script>
{
const S = 'stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"';
const spark = (x, y) => `<path d="M${x} ${y - 3}l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/>`;
const flake = (x, y) => `<path d="M${x - 4} ${y}h8M${x} ${y - 4}v8M${x - 3} ${y - 3}l6 6M${x + 3} ${y - 3}l-6 6"/>`;
const CANE = 'M10 30H196a14 14 0 0 0 0-24 14 14 0 0 0-14 12';
const ART = {
  tree:`<svg viewBox="0 0 60 80"><g fill="#fff"><path d="M30 6 18 24h7L13 40h8L8 58h44L39 40h8L35 24h7z"/><rect x="26" y="58" width="8" height="10"/>
    ${[[8,10],[52,14],[5,40],[55,44],[50,72],[10,70]].map(([x, y]) => spark(x, y)).join('')}</g></svg>`,
  star:`<svg viewBox="0 0 60 60"><path ${S} d="M30 6l6.5 15 16 1.4-12 10.6 3.6 15.7L30 40.4 15.9 48.7l3.6-15.7-12-10.6 16-1.4z"/><circle cx="30" cy="29" r="4" fill="#fff"/></svg>`,
  plane:`<svg viewBox="0 0 70 50"><path ${S} d="M6 30l52-18c4-1 7 2 4 5L40 30l-4 14-6 2 1-12-12 4-5 8-4 1 1-10z"/><path ${S} stroke-dasharray="2 5" d="M4 44c10-2 18-6 24-12"/></svg>`,
  heart:`<svg viewBox="0 0 70 60"><path fill="#fff" d="M35 52S10 38 10 22c0-8 6-13 12-13 6 0 10 4 13 9 3-5 7-9 13-9 6 0 12 5 12 13 0 16-25 30-25 30z"/>
    <g ${S} stroke-width="1.6">${[[5,8],[64,10],[65,48],[4,46]].map(([x, y]) => flake(x, y)).join('')}</g></svg>`,
  balloon:`<svg viewBox="0 0 60 80"><ellipse cx="30" cy="26" rx="16" ry="20" fill="#fff"/><path fill="#fff" d="M27 45h6l-3 4z"/><path ${S} d="M30 49c-5 8 5 12 0 20s4 8 2 10"/><path d="M22 16c2-4 5-6 8-6" stroke="#c3171f" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`,
  gift:`<svg viewBox="0 0 60 60"><path ${S} d="M10 26h40v26H10zM7 18h46v8H7zM30 18v34"/><path ${S} d="M30 18c-6-10-16-8-14-2 1 3 8 2 14 2 6 0 13 1 14-2 2-6-8-8-14 2"/></svg>`,
  cane:`<svg viewBox="0 0 220 40" preserveAspectRatio="xMidYMid meet"><defs><pattern id="st" width="14" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="7" height="40" fill="#fff"/></pattern></defs>
    <path d="${CANE}" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="${CANE}" stroke="#c3171f" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="${CANE}" stroke="url(#st)" stroke-width="8" fill="none" stroke-linecap="round"/></svg>`,
  orn:`<svg viewBox="0 0 80 96"><path ${S} d="M40 2v10"/><rect x="33" y="12" width="14" height="8" rx="1" ${S}/><circle cx="40" cy="56" r="34" fill="#fff"/>
    <circle cx="40" cy="56" r="30" fill="none" stroke="#c3171f" stroke-width="1.2" stroke-dasharray="1 3"/>
    <text x="40" y="45" text-anchor="middle" font-family="Special Elite" font-size="10" fill="#b5121b">NO.</text>
    <text x="40" y="76" text-anchor="middle" font-family="Alfa Slab One" font-size="30" fill="#b5121b">01</text></svg>`
};

/* 문 9개: 앞면 디자인 + 안쪽 사진 + 크게 보기 내용 */
const DOORS = [
  {area:'a', lab:'D+365', front:`<div class="num">365<sup>DAYS</sup></div>`, ko:'', thumb:'oneyear.jpg',
   t:'진짜 1년 된 거야 그러면?', s:'나휘님이 우리 회사에 온 지 딱 1년!', shots:[['oneyear.jpg','벌써…? 진짜로…?']]},
  {area:'b', lab:'TEAM', art:'tree', ko:'우리 팀 단체샷', thumb:'team.jpg',
   t:'우리의 1위 모먼트', s:'이 팀, 이 사진, 이 순간', shots:[['team.jpg','NO.1은 역시 우리 팀']]},
  {area:'c', lab:'DERMA CLASS', art:'star', ko:'현장 출근 도장', thumb:'sign.jpg',
   t:'현장 출근 도장 쾅!', s:'간판 찍고, 얼굴 가리고(?) 인증샷까지', shots:[['sign.jpg','CLASS ENTRANCE →'],['booth.jpg','얼굴은 크림으로 대신']]},
  {area:'d', lab:'FIRST CLASS', art:'plane', ko:'퍼스트 클래스 탑승', thumb:'seat1.jpg',
   t:'퍼스트 클래스 탑승 완료', s:'구름 위 팝업스토어로 출발', shots:[['firstclass.jpg','팝업 오픈 날'],['seat1.jpg','기내 독서 중'],['seat2.jpg','창밖은 구름']]},
  {area:'e', lab:'EVERYWHERE', art:'orn', ko:'곳곳의 흔적', thumb:'mh.jpg',
   t:'곳곳에 남긴 나휘님의 흔적', s:'지하상가 광고부터 체험존까지', shots:[['mh.jpg','광고 앞 인증샷'],['game.jpg','열정 MAX']]},
  {area:'f', lab:'BEHIND', art:'heart', ko:'디테일 장인', thumb:'dessert.jpg',
   t:'세팅도 우리가, 사진도 우리가', s:'디테일 장인 나휘님의 손길', shots:[['dessert.jpg','마카롱 하나하나'],['buffet.jpg','기록은 필수']]},
  {area:'g', lab:'GUEST', art:'balloon', ko:'키다리 아저씨', thumb:'clown2.jpg',
   t:'키다리 아저씨와의 만남', s:'풍선 선물에 미소 한가득', video:'clown.mp4', shots:[['clown2.jpg','초록 풍선 get!']]},
  {area:'h', lab:'OPEN LAST', art:'gift', ko:'마지막에 열기', thumb:'cake.jpg', last:true,
   t:'나휘님, 입사 1주년 축하해요!', s:'To. 나휘님', shots:[['cake.jpg','우리 사랑 영원히..♡']],
   note:'지난 1년 동안 현장 곳곳을 누비며<br><b>늘 웃으면서 함께해줘서 고마워요.</b><br>2년차에도 잘 부탁해요 🎄'},
  {area:'i', lab:'MOTTO', art:'cane', ko:'뭉치면 주먹밥', thumb:'jumeok.jpg', row:true,
   t:'앞으로도 꼭 붙어 있어요', s:'팀워크의 진리', shots:[['jumeok.jpg','뭉치면 주먹밥 🍙']],
   note:'뭉치면 주먹밥, 흩어지면 볶음밥…<br><b>우리는 영원한 주먹밥 팀!</b>'}
];

const grid = document.getElementById('grid'), house = document.getElementById('house');
const modal = document.getElementById('modal'), card = document.getElementById('card');
const KEY = 'nahwi-advent-v1';
let opened = new Set();
try { opened = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...opened])); } catch (e) {} };

/* 톱니 가장자리 집 모양 */
const pts = [];
const seg = (x1, y1, x2, y2, n) => { for (let k = 0; k < n; k++) { const t = k / n, j = (Math.random() - .5) * .9;
  pts.push(`${(x1 + (x2 - x1) * t + (x1 === x2 ? j : 0)).toFixed(2)}% ${(y1 + (y2 - y1) * t + (x1 === x2 ? 0 : j)).toFixed(2)}%`); } };
seg(.5, 99.5, .5, 21, 60); seg(.5, 21, 50, .6, 46); seg(50, .6, 99.5, 21, 46); seg(99.5, 21, 99.5, 99.5, 60); seg(99.5, 99.5, .5, 99.5, 50);
house.style.clipPath = `polygon(${pts.join(',')})`;

grid.innerHTML = DOORS.map((d, i) => `
  <div class="cell${opened.has(i) ? ' open' : ''}" style="grid-area:${d.area}" data-i="${i}">
    <div class="win" role="button" tabindex="${opened.has(i) ? 0 : -1}" aria-label="${d.t} 크게 보기" style="background-image:url(assets/${d.thumb})"></div>
    <button class="door" type="button" aria-label="${d.lab} 문 열기" ${opened.has(i) ? 'disabled' : ''}>
      <span class="face front"${d.row ? ' style="flex-direction:row;align-items:center;gap:4%"' : ''}>
        <span class="lab">${d.lab}</span>
        <span class="art">${d.front || ART[d.art]}</span>
        <span class="ko"${d.row ? ' style="margin:0"' : ''}>${d.ko}</span>
      </span>
      <span class="face back"></span>
    </button>
  </div>`).join('');

const prog = document.getElementById('prog'), cnt = document.getElementById('cnt');
prog.innerHTML = DOORS.map(() => '<i></i>').join('');
function status() {
  [...prog.children].forEach((el, i) => el.classList.toggle('on', opened.has(i)));
  cnt.textContent = opened.size === 0 ? '문을 눌러 열어보세요' : opened.size === DOORS.length ? '모두 열었어요! 🎄' : `열린 문 ${opened.size} / ${DOORS.length}`;
}
status();

let lastFocus = null;
function show(i) {
  const d = DOORS[i], n = d.shots.length + (d.video ? 1 : 0);
  card.innerHTML = `<button class="x" id="x" type="button" aria-label="닫기">×</button>
    <div class="lab">${d.lab}</div><h2 id="mt">${d.t}</h2><div class="sub">${d.s}</div>
    <div class="shots n${n}">
      ${d.video ? `<figure class="pol vid"><video id="clip" src="assets/${d.video}" poster="assets/clown_poster.jpg" muted loop playsinline autoplay></video><button class="snd" id="snd" type="button">🔇 소리 켜기</button><figcaption>▶ 그날의 현장</figcaption></figure>` : ''}
      ${d.shots.map(([src, c]) => `<figure class="pol"><img src="assets/${src}" alt="${c}"><figcaption>${c}</figcaption></figure>`).join('')}
    </div>${d.note ? `<p class="note">${d.note}</p>` : ''}`;
  lastFocus = document.activeElement;
  modal.classList.add('on'); card.scrollTop = 0;
  document.getElementById('x').focus({ preventScroll: true });
  const v = document.getElementById('clip'), b = document.getElementById('snd');
  if (v) { v.play().catch(() => {}); b.onclick = () => { v.muted = !v.muted; b.textContent = v.muted ? '🔇 소리 켜기' : '🔊 소리 끄기'; v.play().catch(() => {}); }; }
}
function hide() {
  const v = document.getElementById('clip'); if (v) v.pause();
  modal.classList.remove('on'); if (lastFocus) lastFocus.focus({ preventScroll: true });
}

grid.addEventListener('click', e => {
  const cell = e.target.closest('.cell'); if (!cell) return;
  const i = +cell.dataset.i;
  if (e.target.closest('.door')) {
    cell.classList.add('open'); cell.querySelector('.door').disabled = true; cell.querySelector('.win').tabIndex = 0;
    opened.add(i); save(); status();
    setTimeout(() => show(i), 850);
    if (opened.size === DOORS.length || DOORS[i].last) setTimeout(() => burst(200), 900);
  } else if (e.target.closest('.win')) show(i);
});
grid.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('win')) { e.preventDefault(); show(+e.target.parentNode.dataset.i); } });
modal.addEventListener('click', e => { if (e.target === modal || e.target.id === 'x') hide(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('on')) hide(); });

document.getElementById('reset').onclick = () => {
  opened.clear(); save(); status();
  grid.querySelectorAll('.cell').forEach(c => { c.classList.remove('open'); c.querySelector('.door').disabled = false; c.querySelector('.win').tabIndex = -1; });
};

/* 눈 + 컨페티 */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fx = document.getElementById('fx'), fc = fx.getContext('2d'), cf = document.getElementById('cf'), cc = cf.getContext('2d');
let parts = [], craf = null;
const flakes = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 2.2 + .8, s: Math.random() * .0012 + .0006, w: Math.random() * 6.28 }));
function size() { const r = devicePixelRatio || 1; for (const c of [fx, cf]) { c.width = innerWidth * r; c.height = innerHeight * r; } }
addEventListener('resize', size); size();
function snow() {
  const r = devicePixelRatio || 1; fc.clearRect(0, 0, fx.width, fx.height); fc.fillStyle = 'rgba(255,255,255,.85)';
  for (const f of flakes) { f.y += f.s; f.w += .01; if (f.y > 1.02) { f.y = -.02; f.x = Math.random(); }
    fc.beginPath(); fc.arc((f.x + Math.sin(f.w) * .01) * fx.width, f.y * fx.height, f.r * r, 0, 6.28); fc.fill(); }
  requestAnimationFrame(snow);
}
if (!reduce) snow();
const COLS = ['#b5121b', '#ffffff', '#e8343c', '#1f6b45', '#f3d27a'];
function burst(n) {
  if (reduce) return; const r = devicePixelRatio || 1;
  for (let k = 0; k < n; k++) parts.push({ x: cf.width * (.5 + (Math.random() - .5) * .3), y: cf.height * .42, vx: (Math.random() - .5) * 16 * r, vy: (-Math.random() * 15 - 4) * r,
    w: (5 + Math.random() * 6) * r, h: (8 + Math.random() * 8) * r, a: Math.random() * 6.28, va: (Math.random() - .5) * .3, c: COLS[k % COLS.length], t: 0 });
  if (!craf) conf();
}
function conf() {
  const r = devicePixelRatio || 1; cc.clearRect(0, 0, cf.width, cf.height);
  parts = parts.filter(p => p.y < cf.height + 40 && p.t < 400);
  for (const p of parts) { p.t++; p.vy += .35 * r; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.a += p.va;
    cc.save(); cc.translate(p.x, p.y); cc.rotate(p.a); cc.fillStyle = p.c; cc.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.a * 1.7))); cc.restore(); }
  craf = parts.length ? requestAnimationFrame(conf) : (cc.clearRect(0, 0, cf.width, cf.height), null);
}
}
